<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHISHGUARD – Create Account</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body style="background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="auth-container">
    <div class="auth-brand">PHISHGUARD</div>
    <h2>Create your account</h2>
    <p class="auth-subtitle">Start protecting your organization</p>
    <form id="signup-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required />
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required />
      <button type="submit">Create Account &rarr;</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
  </div>

  <script type="module">
    import { auth } from './js/auth.js';
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = e.target.username.value.trim();
      const email = e.target.email.value.trim();
      const password = e.target.password.value;
      const confirm = e.target.confirm_password.value;
      if (password !== confirm) {
        alert('Passwords do not match');
        return;
      }
      try {
        await auth.register({ username, email, password });
        alert('Registration successful, please log in');
        window.location.href = 'login.html';
      } catch (err) {
        alert('Registration failed: ' + err.message);
      }
    });
  </script>
</body>
</html>
