<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHISHGUARD – AI Security Analyst</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/analysis.css" />
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">PHISHGUARD</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="analysis.html">Analyze</a>
    <a href="history.html">History</a>
    <a href="#">Threat Intelligence</a>
    <a href="#">Reports</a>
    <a href="analyst.html" class="active">AI Security Analyst</a>
    <div class="sidebar-section">
      <a href="settings.html">Settings</a>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </nav>

  <div class="main-content">
    <header>
      <h1>AI Security Analyst</h1>
      <p class="text-muted">Interactive evidence investigation and threat triage assistant</p>
    </header>

    <section id="analyst-workspace" style="max-width: 900px;">
      <div id="analyst-chat-root"></div>
    </section>
  </div>

  <script type="module">
    import { auth } from './js/auth.js';
    import { setupAnalystChat } from './js/analysis.js';

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      auth.logout();
    });

    document.addEventListener('DOMContentLoaded', () => {
      let savedContext = null;
      try {
        const stored = sessionStorage.getItem('currentAnalysisContext');
        if (stored) {
          savedContext = JSON.parse(stored);
        }
      } catch (err) {
        console.warn('Failed to parse saved context', err);
      }

      setupAnalystChat('analyst-chat-root', savedContext);
    });
  </script>
</body>
</html>
